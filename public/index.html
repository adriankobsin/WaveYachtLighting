<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exterior Lighting Control – Wave AVI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2210%22 fill=%22%23F2B45A%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&subset=cyrillic&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1622;--panel:#112131;--panel2:#0F1E2D;--rail:#0E1B28;--line:#22344A;--line2:#3A5069;--text:#E7EEF5;--muted:#9FB2C6;--amber:#F2B45A;--glow:#FFB347}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100vh}
header{min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--rail);border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand b{font:600 18px 'Space Grotesk',Inter,sans-serif;letter-spacing:.12em}
.muted{color:var(--muted)}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:#16283A;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#5B7390}
.btn.primary{background:var(--amber);color:#0B1622;border-color:var(--amber)}
.btn.danger{border-color:#8A4B4B;color:#F3C1C1}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{height:38px;padding:0 12px;font-size:13px}
.layout{flex:1;display:flex;min-height:0;flex-wrap:wrap}
nav{width:200px;flex:none;background:var(--rail);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.ritem{min-height:60px;padding:0 14px;border:none;border-left:3px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;color:#C9D6E3}
.ritem.on{background:#1C3047;border-left-color:var(--amber);color:#fff}
.ritem span{font-weight:600;font-size:15px}.ritem small{font-size:12px;color:var(--muted)}
main{flex:999 1 560px;min-width:0;padding:22px 28px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font:600 26px 'Space Grotesk',Inter,sans-serif}
h2{margin:0;font:600 18px 'Space Grotesk',Inter,sans-serif}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line2);background:#16283A;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--amber);color:#0B1622;border-color:var(--amber)}
.lbl{font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.08em}
.plan{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:30px;overflow:auto}
.pbox{position:relative;max-width:100%;touch-action:none}
.pbox img{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none;user-select:none;-webkit-user-drag:none}
.glow{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
.glow>div{position:absolute;inset:0;background:var(--glow)}
.core{position:absolute;inset:0;border:0;margin:0;padding:0;cursor:pointer}
svg.edit{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.edit polygon{cursor:move}
.pwrap{position:relative;margin:0 auto}
.pwrap>.pbox{width:100%;height:100%}
.fxsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.thumb .fxsvg{pointer-events:none}
.fxsvg .glow{transition:opacity 1.2s ease;pointer-events:none}
.fx .sym *{fill:#0B1622;stroke:#7D90A6;stroke-width:1.3px;vector-effect:non-scaling-stroke;transition:fill .6s,stroke .6s}
.fx.on .sym *{fill:var(--c);stroke:var(--c)}
.fx.line .sym *{fill:none;vector-effect:none}
.fx.line.on .sym *{stroke-dasharray:none!important;fill:none}
.fx.neon .sym *{stroke:#34465A;stroke-dasharray:none!important}
.fx.neon.on .sym *{stroke:var(--c)}
.fx.poly .sym *{fill:none;stroke-width:1.2px;stroke-dasharray:4 3}
.fx.poly.on .sym *{fill:none;stroke:var(--c);stroke-opacity:.5}
.fx.csel .sym *{stroke:#F2B45A}
.fx.csel.poly .sym *{stroke-opacity:1;stroke-dasharray:none}
.fx.sel .sym *{stroke:#fff;stroke-opacity:1}
.fx.ni .sym *{opacity:.45}
.fx .hit{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
.fx.poly .hit{pointer-events:fill}
.fxsvg .hd{cursor:grab}
.plan.tool .pbox{cursor:crosshair}
.fxpal{display:flex;gap:6px;flex-wrap:wrap}
.fxbtn{width:84px;height:68px;border-radius:10px;border:1px solid var(--line2);background:#0D1A27;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#C9D6E3;padding:2px;line-height:1.1;text-align:center}
.fxbtn.on{border-color:var(--amber);background:#1C3047;color:#fff}
.fxpop{position:absolute;z-index:4;width:270px;background:#132638;border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:left}
.fxpop .ref{white-space:normal}
.fxpop .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 2px;height:28px}
.fxlist{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.fxrow{display:flex;align-items:center;gap:8px;padding:2px 4px;border-radius:8px;border:1px solid transparent}
.fxrow.on{border-color:var(--amber);background:#1C3047}
.fxname{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;text-align:left;font-size:13px;font-weight:600;padding:2px 0}
.fxname svg{flex:none;width:28px;height:28px}
.fxname .dot{width:12px;height:12px;border-radius:6px;flex:none;border:1px solid rgba(255,255,255,.3)}
.fxed{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.fsl{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.swc{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swc.on{border-color:#fff}
input[type=color]{width:34px;height:30px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:2px;cursor:pointer}
.hidtag{font-size:11px;color:#F6D8A8;border:1px solid #6B4E1E;border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
.dshow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.sel{border-color:var(--amber)}
.badge{min-width:42px;height:34px;flex:none;border-radius:8px;border:2px solid #7F93A8;background:rgba(11,22,34,.9);font-size:10px;font-weight:600;cursor:pointer;padding:0 4px}
.name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.ref{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:52px;height:32px;flex:none;border-radius:16px;border:none;background:#2A3D53;position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--amber)}.sw[aria-checked="true"]::after{left:23px}
input[type=range]{flex:1;min-width:0;height:28px;margin:0;accent-color:var(--amber)}
.pct{width:46px;text-align:right;font:600 14px 'Space Grotesk',Inter,sans-serif;color:var(--muted)}.pct.on{color:var(--amber)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer}
.dcard:hover{border-color:var(--line2)}
.thumb{height:120px;background:var(--bg);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:10px;width:100%}
.bar{height:4px;background:var(--line);border-radius:2px;width:100%}.bar>div{height:4px;background:var(--amber);border-radius:2px}
.note{background:var(--panel);border:1px dashed var(--line2);border-radius:12px;padding:12px 16px;font-size:13px;color:#C9D6E3}
.adminbar{background:#2A1F0E;border:1px solid #6B4E1E;color:#F6D8A8;border-radius:12px;padding:10px 14px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tab{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:600}
.tab.on{background:#1C3047;border-color:var(--amber)}
.split{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:16px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,.inp{height:40px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);padding:0 10px;font-size:14px;color:var(--text)}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;height:40px;align-self:end}
label.chk input{width:20px;height:20px;accent-color:var(--amber)}
.list{display:flex;flex-direction:column;gap:4px;max-height:330px;overflow:auto}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent;text-align:left;cursor:pointer;width:100%}
.li.on{border-color:var(--amber);background:#1C3047}
.li .sq{width:12px;height:12px;border-radius:3px;flex:none}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(120px,240px) 60px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow select{height:40px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);padding:0 8px;font-size:13px;color:var(--text)}
.srow input[type=range][disabled]{opacity:.35}
.pct.keep{color:#8FB8E8}
.sgroup{margin-top:12px;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.08em}
@media (max-width:700px){.srow{grid-template-columns:minmax(0,1fr) 130px;}.srow input[type=range]{grid-column:1/2}}
.modal{position:fixed;inset:0;background:rgba(5,10,16,.72);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.dialog{width:min(380px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.err{color:#F3A6A6;font-size:13px;min-height:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1C3047;border:1px solid var(--amber);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:700px){nav{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.ritem{min-width:140px}main{padding:16px}}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:#16283A}
.pill i{width:9px;height:9px;border-radius:5px;display:inline-block;background:#7F93A8}
.pill.ok i{background:#5BD18B}.pill.warn i{background:#F2B45A}.pill.bad i{background:#F07C7C}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px;font-size:14px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.deckrow td{background:#0F1E2D;font-weight:600;color:#C9D6E3;font-size:12px;letter-spacing:.06em}
.tbl input,.tbl select{height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);padding:0 8px;font-size:13px;color:var(--text);width:100%}
.result{border-radius:10px;padding:12px 14px;font-size:13px;border:1px solid var(--line2);background:var(--panel2)}
.result.ok{border-color:#2F7A52;background:#0F2A1D}.result.bad{border-color:#8A4B4B;background:#2A1414}
.ritem.admin small{color:#F6D8A8}
.lang{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;height:44px}
.lang button{border:0;background:#16283A;padding:0 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);min-width:44px}
.lang button[aria-pressed="true"]{background:var(--amber);color:#0B1622}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty">Loading lighting layout…</div></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="i18n.js?v=1.5.0"></script>
<script>
(function () {
  'use strict';
  var TYPES = [['walk', 'Walkway / side deck'], ['lounge', 'Lounge / seating'], ['feature', 'Feature / LED'], ['sign', 'Signage'], ['deck', 'Working deck'], ['flood', 'Floodlight (beam)']];
  var S = {
    config: null, saved: null, levels: {}, sceneBy: {}, admin: false, user: null, users: null, adminConfigured: true,
    lutron: { state: 'idle', connected: false }, lx: null, lxTest: null, lxBusy: '',
    view: 'home', sel: '', tab: 'lights', selFx: null, tool: '', draw: null, drawMouse: null, pop: null, zoom: {}, pxu: {}, sceneSel: '', dirty: false, saving: false, loadError: ''
  };

  // ---------- language ----------
  var LANG = 'en';
  try { LANG = localStorage.getItem('wl-lang') === 'ru' ? 'ru' : 'en'; } catch (e) {}
  document.documentElement.lang = LANG;
  var I18N = window.WL_I18N || { ru: {}, ruPatterns: [] };
  /** Interface text: English is the key; {name} placeholders are filled from v. */
  function t(en, v) {
    var r = (LANG === 'ru' && I18N.ru[en]) || en;
    if (v) r = r.replace(/\{(\w+)\}/g, function (m, k) { return v[k] !== undefined ? v[k] : m; });
    return r;
  }
  /** Messages from the server: exact match, then patterns with variable parts. */
  function tm(msg) {
    msg = String(msg || '');
    if (LANG !== 'ru') return msg;
    if (I18N.ru[msg]) return I18N.ru[msg];
    for (var i = 0; i < I18N.ruPatterns.length; i++) { var m = I18N.ruPatterns[i][0].exec(msg); if (m) return I18N.ruPatterns[i][1].replace(/\$(\d)/g, function (x, n) { return m[+n]; }); }
    return msg;
  }
  /** Names of decks, circuits and scenes: the Russian name when set. */
  function nm(o) { return (o && LANG === 'ru' && o.ru && o.ru.name) || (o && o.name) || ''; }
  function noteOf(d) { return (LANG === 'ru' && d.ru && d.ru.note) || d.note || ''; }
  function setLang(l) { LANG = l === 'ru' ? 'ru' : 'en'; try { localStorage.setItem('wl-lang', LANG); } catch (e) {} document.documentElement.lang = LANG; }

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function toast(msg) { var el = document.getElementById('toast'); el.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>'; clearTimeout(toast._t); toast._t = setTimeout(function () { el.innerHTML = ''; }, 3200); }
  function api(method, url, body) {
    return fetch(url, { method: method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
  }
  function warn(res) { if (res && res.warnings && res.warnings.length) toast('Lutron: ' + tm(res.warnings[0]) + (res.warnings.length > 1 ? ' ' + t('(+{n} more)', { n: res.warnings.length - 1 }) : '')); }
  function fail(e) { toast(tm(e.message || String(e))); }

  // ---------- model ----------
  function decks() { return (S.config && S.config.decks) || []; }
  function scenes() { return (S.config && S.config.scenes) || []; }
  function deckById(id) { return decks().filter(function (d) { return d.id === id; })[0] || null; }
  function allCircuits() { var seen = {}, out = []; decks().forEach(function (d) { (d.circuits || []).forEach(function (c) { if (!seen[c.id]) { seen[c.id] = 1; out.push(c); } }); }); return out; }
  function circuitIn(deck, cid) { return (deck.circuits || []).filter(function (c) { return c.id === cid; })[0] || null; }
  function lv(c) { return S.levels[c.id] || { on: false, level: c.def || 0 }; }
  function isOn(c) { return !c.ni && lv(c).on; }
  function zonesStr(c) { return ((c.lutron && c.lutron.zones) || []).join(', '); }
  function parseZones(v) { return String(v || '').split(/[^0-9]+/).filter(Boolean).slice(0, 32); }
  function markDirty() { S.dirty = true; }
  /** Decks the crew sees on the dashboard (admins see all of them). */
  function shownDecks() { return S.admin ? decks() : decks().filter(function (d) { return !d.hidden; }); }
  function shownCircuits() { var seen = {}, out = []; shownDecks().forEach(function (d) { (d.circuits || []).forEach(function (c) { if (!seen[c.id]) { seen[c.id] = 1; out.push(c); } }); }); return out; }

  // ---------- fixtures (lights drawn on the GA) ----------
  // Positions are % of the plan width/height; sizes are % of the plan height.
  var FXT = {
    flood: { n: 'Floodlight', fam: 'pt', kind: 'beam', d: { a: 0, len: 30, spread: 50, col: '#FFE9C9' } },
    spot: { n: 'Spotlight', fam: 'pt', kind: 'beam', d: { a: 0, len: 18, spread: 18, col: '#FFC98A' } },
    down: { n: 'Downlight', fam: 'pt', kind: 'pool', d: { r: 6, col: '#FFC98A' } },
    pendant: { n: 'Pendant', fam: 'pt', kind: 'pool', d: { r: 6.5, col: '#FFB869' } },
    wall: { n: 'Wall light', fam: 'pt', kind: 'half', d: { a: 0, r: 8, col: '#FFC98A' } },
    step: { n: 'Step light', fam: 'pt', kind: 'half', d: { a: 90, r: 3, col: '#FFE9C9' } },
    under: { n: 'Underwater', fam: 'pt', kind: 'pool', d: { r: 9, col: '#3FB4FF' } },
    strip: { n: 'LED strip', fam: 'line', kind: 'line', d: { w: 0.8, col: '#FFD9A0' } },
    neon: { n: 'Neon', fam: 'line', kind: 'line', d: { w: 1.3, col: '#FF5FA2' } },
    area: { n: 'Area', fam: 'area', kind: 'poly', d: { col: '#FFB347' } }
  };
  var FXORDER = ['flood', 'spot', 'down', 'pendant', 'wall', 'step', 'under', 'strip', 'neon', 'area'];
  var COLS = [['#FFB869', '2700K'], ['#FFC98A', '3000K'], ['#FFE9C9', '4000K'], ['#E3F0FF', '6000K'], ['#FFB347', 'Amber'], ['#3FB4FF', 'Blue'], ['#4FE6D8', 'Aqua'], ['#FF5FA2', 'Pink'], ['#9B7BFF', 'Violet']];
  function r1(n) { return Math.round(n * 10) / 10; }
  function r2(n) { return Math.round(n * 100) / 100; }
  function safeCol(c) { return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#FFC98A'; }
  /** Older layouts stored lit areas as c.z polygons – turn them into "Area" fixtures. */
  function normalize(cfg) {
    ((cfg && cfg.decks) || []).forEach(function (d) {
      (d.circuits || []).forEach(function (c) {
        if (!Array.isArray(c.fx)) c.fx = (c.z || []).filter(function (p) { return p && p.length >= 3; }).map(function (p) { return { type: 'area', pts: p, col: '#FFB347' }; });
        delete c.z;
      });
    });
    return cfg;

  // ---------- editing lights on the GA ----------
  var drag = null, lastHandle = null;

  function ptFrom(e, free) {
    var box = document.getElementById('pbox'); if (!box) return null;
    var r = box.getBoundingClientRect(), lo = free ? -30 : 0, hi = free ? 130 : 100;
    return [r1(Math.max(lo, Math.min(hi, (e.clientX - r.left) / r.width * 100))), r1(Math.max(lo, Math.min(hi, (e.clientY - r.top) / r.height * 100)))];
  }
  function addFx(c, f) { c.fx = c.fx || []; c.fx.push(f); S.sel = c.id; S.selFx = { cid: c.id, i: c.fx.length - 1 }; markDirty(); }

    var c = circuitIn(d, S.sel), T = FXT[S.tool];
    if (!c) { toast(t('Select a circuit first – in the list under the plan, or tap one of its lights.')); return; }
    if (T.fam === 'pt') { addFx(c, Object.assign({ type: S.tool, x: pt[0], y: pt[1] }, clone(T.d))); render(); return; }

    if (!S.draw) S.draw = { type: S.tool, cid: c.id, pts: [] };
    var dr = S.draw;
    if (dr.pts.length && now - dr.t < 400 && Math.hypot(e.clientX - dr.sx, e.clientY - dr.sy) < 8) { finishDraw(); return; }

  }

    S.draw = null; S.drawMouse = null; S.tool = '';

    };
  }
  function logout() { api('POST', '/api/logout').catch(function () {}).then(function () { S.admin = false; S.user = null; S.users = null; S.selFx = null; S.tool = ''; S.draw = null; if (S.view === 'lutron' || S.view === 'users') S.view = 'home'; clearInterval(lxPoll); render(); }); }
  function askConfirm(msg, ok) {
    var m = document.getElementById('modal');
    m.innerHTML = '<div class="modal"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="ct"><h2 id="ct">' + t('Are you sure?') + '</h2><div style="font-size:14px">' + esc(msg) + '</div><div class="row" style="justify-content:flex-end"><button class="btn" id="cNo">' + t('Cancel') + '</button><button class="btn primary" id="cYes">' + t('Yes') + '</button></div></div></div>';
    document.getElementById('cNo').onclick = closeModal;
    document.getElementById('cYes').onclick = function () { closeModal(); ok(); };
    document.getElementById('cYes').focus();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.getElementById('modal').innerHTML) closeModal(); });

  // ---------- persistence ----------
  function discard() { S.config = clone(S.saved); S.dirty = false; S.selFx = null; S.tool = ''; S.draw = null; }
  function save() {
    S.saving = true; render();
    api('PUT', '/api/config', { decks: S.config.decks, scenes: S.config.scenes })
      .then(function () { S.saved = clone(S.config); S.dirty = false; toast(t('Saved – the new layout is live on all control panels')); })
      .catch(function (e) { if (/Admin/.test(e.message)) { toast(t('Your admin session expired. Log in again, then press Save.')); openLogin(); } else fail(e); })
      .then(function () { S.saving = false; render(); });
  }

  // ---------- start ----------
  function connectEvents() {
    var es = new EventSource('/api/events');
    es.addEventListener('state', function (ev) {
      var m = JSON.parse(ev.data);
      S.levels = m.levels || {}; S.sceneBy = m.sceneBy || {};
      if (drag || S.draw) return;
      var a = document.activeElement;
      if (a && a.type === 'range') return scheduleRender();
      if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT') && a.type !== 'range') { updateHeaderOnly(); return; }
      render();
    });
    es.addEventListener('lutron', function (ev) { S.lutron = JSON.parse(ev.data); var a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT')) updateHeaderOnly(); else render(); });
    es.addEventListener('config', function (ev) { var c = normalize(JSON.parse(ev.data)); S.saved = clone(c); if (!S.dirty) { S.config = c; render(); } });
    es.onerror = function () { S.lutron = Object.assign({}, S.lutron, { state: 'error', connected: false, lastError: 'Lost connection to the lighting server' }); updateHeaderOnly(); };
  }
  api('GET', '/api/bootstrap').then(function (b) {
    S.config = normalize(b.config); S.saved = clone(S.config); S.levels = b.levels || {}; S.sceneBy = b.sceneBy || {};
    S.admin = !!b.admin; S.user = b.user || null; S.lutron = b.lutron || S.lutron; S.adminConfigured = b.adminConfigured;
    render(); connectEvents();
  }).catch(function (e) { S.loadError = t('Cannot reach the lighting server: {err}', { err: tm(e.message) }); render(); setTimeout(function () { location.reload(); }, 10000); });
})();
</script>
</body>
